services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-rest-api-postgres
    environment:
      POSTGRES_DB: enterprise_api
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d enterprise_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
